name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  wind-generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wind_generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wind_generator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.25"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install batch dependencies
        run: uv sync --project batch_gpv_wind --locked

      - name: Check batch imports
        run: uv run --project batch_gpv_wind --locked python -c "import numpy, pandas, psycopg2, pygrib"

      - name: Test batch downloader
        working-directory: batch_gpv_wind
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Install analysis dependencies
        run: uv sync --project wind_analysis --locked

      - name: Check analysis imports
        run: uv run --project wind_analysis --locked python -c "import folium, polars, psycopg2"

      - name: Compile Python sources
        run: python -m compileall -q wind_analysis batch_gpv_wind
